<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#182838">
    <meta name="description" content="Welcome to the Giotto ARC workshop. Find the rules, open an editor, and submit your task.">
    <title>Giotto · ARC workshop</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="welcome">
      <header>
        <!-- Replace this wordmark with the Giotto logo when available. -->
        <a class="wordmark" href="https://www.giotto.ai/" aria-label="Giotto homepage">giotto<span>.ai</span></a>
        <span class="eyebrow">ARC WORKSHOP</span>
      </header>

      <section class="intro" aria-labelledby="welcome-title">
        <h1 id="welcome-title">Welcome to the<br>Giotto ARC workshop.</h1>
        <p>Create a puzzle. Challenge AI.</p>
      </section>

      <section class="rules" aria-labelledby="rules-title">
        <h2 id="rules-title">Workshop rules</h2>
        <!-- Add the workshop rules here. -->
        <p>Rules will be added here soon.</p>
      </section>

      <section class="actions" aria-label="Workshop links">
        <div class="editor-action">
          <a class="button primary" href="https://hadrien-espic-giotto.github.io/arc-editor-giotto-hackathon/">Open the editor <span aria-hidden="true">↗</span></a>
          <a class="backup" href="https://kirt.land/arc-editor/">Use the backup editor <span aria-hidden="true">↗</span></a>
        </div>
        <div>
          <!-- Replace this disabled button with an <a href="SUBMISSION_URL"> when ready. -->
          <button class="button submission" type="button" disabled aria-describedby="submission-status">Submit your task <span aria-hidden="true">↗</span></button>
          <p class="status" id="submission-status">Submission link coming soon</p>
        </div>
      </section>
    </main>
  </body>
</html>
