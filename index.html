<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Welcome to the Giotto ARC workshop. Create and submit a puzzle, then download your assigned team's task for human evaluation.">
    <title>Giotto · ARC workshop</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./download.js" defer></script>
  </head>
  <body>
    <main class="welcome">
      <header>
        <a class="wordmark" href="https://www.giotto.ai/" aria-label="Giotto homepage">
          <img src="./logo_oct5.jpeg" alt="Giotto.ai" width="800" height="266">
        </a>
        <span class="eyebrow">ARC WORKSHOP</span>
      </header>

      <section class="intro" aria-labelledby="welcome-title">
        <h1 id="welcome-title">Welcome to the<br>Giotto ARC workshop.</h1>
        <p>Design a puzzle frontier AI can't solve.</p>
      </section>

      <section class="actions" aria-label="Workshop links">
        <div class="editor-action">
          <a class="button primary" href="https://hadrien-espic-giotto.github.io/arc-editor-giotto-hackathon/" target="_blank" rel="noopener noreferrer">Open the editor <span aria-hidden="true">↗</span></a>
          <a class="backup" href="https://kirt.land/arc-editor/" target="_blank" rel="noopener noreferrer">Use the backup editor <span aria-hidden="true">↗</span></a>
        </div>
        <div class="submission-links">
          <a class="button submission" href="https://tally.so/r/xXeqrv" target="_blank" rel="noopener noreferrer">Submit JSON <span aria-hidden="true">↗</span></a>
          <a class="button submission" href="https://tally.so/r/A7Vgd0" target="_blank" rel="noopener noreferrer">Submit rule description <span aria-hidden="true">↗</span></a>
        </div>
      </section>

      <section class="task-download" aria-labelledby="download-title">
        <h2 id="download-title">Download your assigned team's task</h2>
        <p id="download-help">For human evaluation. Enter the file name, with or without .json.</p>
        <form id="download-form">
          <label for="task-filename">File name</label>
          <div class="download-controls">
            <input id="task-filename" name="filename" type="text" placeholder="FILE_NAME" aria-describedby="download-help" autocomplete="off" autocapitalize="none" spellcheck="false" required>
            <button class="button primary" type="submit">Download JSON</button>
          </div>
          <p id="download-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </body>
</html>
